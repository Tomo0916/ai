<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI学科 学習マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 落ち着いた教務資料。正確で、教員がそのまま授業設計に使える
   IDEA: 路線図。基礎から総合プロジェクトまでを駅として進む一本の路線
   PICTURE: 6駅の本線と、全区間を並走する横断テーマ線。駅を押すと解説が開く
   COLOUR and TYPE: アルミ地に黒、現在地だけオレンジ。Geist + Noto Sans JP
   LAYOUT: 上に路線図、下に詳細パネル、最後に年間計画表。600px以下で縦路線 */
:root{color-scheme:light dark;--bg:light-dark(#e9eaec,#141517);--card:light-dark(#ffffff,#1d1f22);--ink:light-dark(#111214,#eceef0);--sub:light-dark(#55585e,#a3a7ae);--line:light-dark(#111214,#d8dbe0);--rule:light-dark(#cfd2d6,#2e3136);--acc:#ff4f00;--accsoft:light-dark(#ffe6da,#3a1c0f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Geist","Noto Sans JP","Noto Sans SC","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Sinhala","Noto Sans Myanmar",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(32px,5vw,48px);line-height:1.1;margin:0 0 12px;font-weight:700;text-wrap:balance}
h2{font-size:24px;line-height:1.3;margin:0 0 16px;font-weight:700}
h3{font-size:17px;margin:24px 0 8px;font-weight:700}
.lead{color:var(--sub);max-width:46em;margin:0}
.map{margin-top:32px;background:var(--card);border-radius:16px;padding:32px clamp(16px,3vw,40px) 28px}
.track-label{font-size:13px;color:var(--sub);margin:0 0 8px;font-weight:500}
.route{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
.route::before{content:"";position:absolute;left:8%;right:8%;top:22px;height:6px;background:var(--line);border-radius:3px}
.route.sub{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:28px}
.route.sub::before{height:0;background:none;border-top:3px dashed var(--sub);top:21px;left:10%;right:10%}
.st{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0 4px 8px;min-height:44px;border-radius:10px;width:100%}
.dot{width:50px;height:50px;border-radius:50%;background:var(--card);border:6px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:16px;transition:transform .2s}
.sub .dot{width:44px;height:44px;border:3px solid var(--sub);font-size:14px;color:var(--sub)}
.st>span:last-child{display:flex;flex-direction:column;align-items:center;gap:2px}
.st .nm{font-weight:700;font-size:15px;line-height:1.35}
.st .ds{font-size:13px;color:var(--sub);line-height:1.4}
.st:hover .dot{transform:scale(1.08)}
.st:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
.st[aria-current=true] .dot{border-color:var(--acc);background:var(--acc);color:#fff}
.st[aria-current=true] .nm{color:var(--acc)}
.hint{font-size:13px;color:var(--sub);margin:20px 0 0;text-align:center}
.panel{background:var(--card);border-radius:16px;padding:clamp(20px,3vw,40px);margin-top:24px}
.phead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:16px}
.phead h2{margin:0;font-size:clamp(24px,3vw,32px)}
.tag{font-size:13px;font-weight:500;background:var(--accsoft);color:light-dark(#9a2f00,#ffb08c);padding:3px 10px;border-radius:999px;white-space:nowrap}
.goal{font-size:17px;margin:16px 0 0;max-width:52em}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 40px}
ul.pts{margin:0;padding-left:1.2em}ul.pts li{margin:4px 0}
.box{background:var(--bg);border-radius:12px;padding:4px 18px 14px;margin-top:20px}
.box h3{margin-top:14px}
.more{border:2px solid var(--acc);border-radius:12px;padding:4px 18px 16px;margin-top:20px}
.res{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.res li{display:flex;flex-direction:column;gap:2px}
.res a{color:var(--ink);font-weight:700;text-decoration-color:var(--acc);text-underline-offset:3px;overflow-wrap:anywhere}
.res span{color:var(--sub);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--ink)}.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:13px;color:var(--sub);font-weight:500}
td.n{text-align:right;white-space:nowrap}
.note{font-size:13px;color:var(--sub);margin-top:10px}
footer{font-size:13px;color:var(--sub)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.langsel span{white-space:nowrap}
.langsel{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.langsel select{min-height:44px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:0 12px;max-width:100%}
.langsel select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
rt{font-size:.55em;color:var(--sub)}
html:lang(my) body{line-height:1.9}
@media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){
 .route,.route.sub{grid-template-columns:minmax(0,1fr);gap:14px}
 .route::before{left:23px;right:auto;top:24px;bottom:24px;width:6px;height:auto}
 .route.sub::before{left:20px;top:22px;bottom:22px;border-top:0;border-left:3px dashed var(--sub);width:0}
 .st{flex-direction:row;text-align:left;align-items:center;gap:14px;padding:0}
 .st>span:last-child{align-items:flex-start}
 .dot{flex:none}.sub .dot{margin-left:3px}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--rule)}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-6.5em;color:var(--sub)}
}
@media(prefers-reduced-motion:reduce){.dot{transition:none}}
</style>
</head>
<body>
<header class="band">
 <div class="wrap">
  <div class="top">
   <h1 id="t-title">AI学科 学習マップ</h1>
   <label class="langsel"><span id="t-lang">言語</span><select id="lang"></select></label>
  </div>
  <p class="lead" id="t-lead"></p>
  <div class="map" role="navigation" aria-label="map">
   <p class="track-label" id="t-trackMain"></p>
   <ol class="route" id="main"></ol>
   <p class="track-label" style="margin-top:32px" id="t-trackSub"></p>
   <ul class="route sub" id="sub"></ul>
   <p class="hint" id="t-hint"></p>
  </div>
  <article class="panel" id="panel" aria-live="polite"></article>
 </div>
</header>
<section class="band" style="padding-top:0">
 <div class="wrap">
  <h2 id="t-planTitle"></h2>
  <table class="stack">
   <thead><tr><th id="t-thDate"></th><th id="t-thCls"></th><th id="t-thStage"></th><th id="t-thAim"></th></tr></thead>
   <tbody id="plan"></tbody>
  </table>
  <p class="note" id="t-planNote"></p>
 </div>
</section>
<footer class="band" style="padding-top:0"><div class="wrap" id="t-footer"></div></footer>
<script>

y tips","cross":"Link to the cross-cutting themes","stepTag":"Stage {n} · {s} classes · {term}","themeTag":"Cross-cutting theme · all stages","prev":"Previous","next":"Next","planTitle":"Upcoming schedule (every Wednesday)","thStage":"Stage","planNote":"There are no classes during winter break (Dec 23 – Jan 10). The schedule is approximate and may change depending on progress.","footer":"Laws, guidelines and AI model specifications change quickly. Check the latest official information.","lang":"Language","sessions":"{s} classes","cls":"Class {k}","thDate":"Date","thCls":"Class","thAim":"Content","more":"Want to learn more?","enNote":"Most resources are in English. Your browser's translation feature can help."},"steps":[{"nm":"Computer and AI basics","ds":"Data and algorithms","goal":"Explain, in simple terms, how computers handle information and how AI differs from ordinary programs.","topics":["Everything is 0 and 1: bits and binary numbers","Text, images and sound are numbers too (character codes, pixels)","Algorithms: solving problems with clear steps","Ordinary programs (people write the rules) vs machine learning (rules are found from data)","AI around us, and a short history of AI"],"ex":["Write your name using character codes and binary numbers","Zoom far into an image and see how pixels relate to numbers"],"check":["Explain in your own words where AI gets its rules from"],"tips":["Rather than calculations, hold on to the idea that inside a computer everything is numbers","Look for AI around you: translation, recommendations, face recognition"],"cross":"Learn that data has a source and limits on how it may be used (licenses).","res":["Experience with cards how computers represent numbers with 0 and 1","A free online course on the big picture of AI, with no math or programming"]},{"nm":"Machine learning","ds":"Learning from examples","goal":"Explain with everyday examples that machine learning finds patterns from many examples.","topics":["Learning and predict ම: ඉගෙනීමට භාවිත නොකළ දත්තවලින් පරීක්ෂා කිරීම","අධි-ගැළපීම (අධික ලෙස කටපාඩම් කිරීම) සහ පක්ෂග්‍රාහී දත්ත"],"ex":["Teachable Machine හි කැමරාව ඉදිරිපිට ඇති දේ හඳුනා ගන්නා ආකෘතියක් සෑදීම","හිතාමතා පක්ෂග්‍රාහී දත්තවලින් පුහුණු කර ප්‍රතිඵල සැසඳීම"],"check":["\"ඉගෙනීම → පුරෝකථනය → ඇගයීම\" ප්‍රවාහය රූප සටහනකින් පැහැදිලි කිරීම"],"tips":["සූත්‍ර අවශ්‍ය නැත. \"උදාහරණ රැසක් → රටාව → පුරෝකථනය\" තේරුම් ගන්න","වැඩ නොකරන විට මුලින්ම දත්ත බලන්න"],"cross":"පක්ෂග්‍රාහී දත්ත AI තීරණ ද පක්ෂග්‍රාහී කරන බව දැන ගැනීම.","res":["කැමරාව හෝ හඬ භාවිතයෙන් බ්‍රව්සරයේම ඔබේම හඳුනාගැනීමේ AI සෑදිය හැක","සජීවිකරණ සහ රූප සටහන් සමඟ යන්ත්‍ර ඉගෙනුමේ මූලිකාංග උගන්වන Google හි නොමිලේ පාඨමාලාව"]},{"nm":"ගැඹුරු ඉගෙනුම","ds":"ස්නායු ජාල","goal":"ස්නායු ජාලයක් යනු එකිනෙකට සම්බන්ධ කුඩා ගණනය කිරීම් රැසක් බවත්, දෝෂය ටිකෙන් ටික අඩු කරමින් ඉගෙන ගන්නා බවත් සිතින් මවා ගැනීම.","topics":["නියුරෝන සහ බර: ආදාන බරින් ගුණ කර එකතු කිරීම","ස්ථර එකතු කිරීමෙන් සංකීර්ණ ලක්ෂණ ග්‍රහණය කළ හැක","ඉගෙනීම යනු පුරෝකථනය සහ පිළිතුර අතර පරතරය ටිකෙන් ටික අඩු කිරීමයි","රූප හඳුනාගැනීම: රේඛාවල සිට හැඩ, ඉන්පසු වස්තු","දෛශික: වචන සහ රූප සංඛ්‍යා පෙළක් ලෙස නිරූපණය කළ විට ඒවා කොතරම් ළඟදැයි මැනිය හැක"],"ex":["TensorFlow Playground හි ස්ථර සහ නියුරෝන ගණන වෙනස් කර ඉගෙනීම බැලීම","සමාන අර්ථ ඇති වචන ළඟින් පිහිටන \"වචන සිතියමක්\" සිතින් මවා ගැනීම"],"check":["ඉගෙනීමේදී ස්නායු ජාලය සකස් කරන්නේ කුමක්දැයි පැහැදිලි කිරීම"],"tips":["එය මොළයට සමාන නොවේ. සංඛ්‍යා රැසක් ටිකෙන් ටික සකස් කරන විශාල ගණනයක් ලෙස සිතන්න","ක්‍රියාත්මක මෙවලමක් බැලීම කියවීමට වඩා බොහෝ පහසුය"],"cross":"මුහුණු සහ හඬ දත්ත පෞද්ගලිකත්වය හා රූප අයිතිය සමඟ සම්බන්ධ බවත්, ඩීප්ෆේක් අවදානම ඇති බවත් දැන ගැනීම.","res":["ස්නායු ජාලයක් ඉගෙන ගන්නා ආකාරය බ්‍රව්සරයේම ක්‍රියාත්මක කර බැලිය හැක","ලස්සන සජීවිකරණ මඟින් ස්නායු ජාල පැහැදිලි කරන වීඩියෝ මාලාව"]},{"nm":"උත්පාදක AI සහ LLM","ds":"ක්‍රියාකාරිත්වය සහ භාවිතය","goal":"LLM ඊළඟ වචනය පුරෝකථනය කරමින් පෙළ ලියන බව පැහැදිලි කිරීම, එහි ශක්තීන් හා දුර්වලතා දැන ගැනීම, සහ හොඳින් භාවිත කිරීම.","topics":["ටෝකන: පෙළ කුඩා කොටස්වලට බෙදනු ලැබේ","ඊළඟ වචනය නැවත නැවත පුරෝකථනය ක const LOC={ja:"ja-JP",easy:"ja-JP",en:"en-GB",ne:"ne-NP",fr:"fr-FR",my:"my-MM",bn:"bn-BD",si:"si-LK",id:"id-ID",vi:"vi-VN",zh:"zh-CN"};
const fmtD=(iso,wd)=>{const [y,m,d]=iso.split("-").map(Number);const o={month:"short",day:"numeric",timeZone:"UTC"};if(wd)o.weekday="short";try{return new Intl.DateTimeFormat(LOC[lang]||"ja-JP",o).format(new Date(Date.UTC(y,m-1,d)))}catch(e){return m+"/"+d}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rb=s=>esc(s).replace(/\{([^{}|]+)\|([^{}]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>");
const plain=s=>String(s).replace(/\{([^{}|]+)\|([^{}]+)\}/g,"$1");
const fill=(s,v)=>s.replace(/\{(n|h|s|k|term)\}/g,(m,k)=>v[k]??m);
const cache={};let D=null,ALL=[],cur=0,lang="ja";
const sel=document.getElementById("lang");
sel.innerHTML=LANGS.map(l=>`<option value="${l[0]}">${esc(l[1])}</option>`).join("");
const panel=document.getElementById("panel");
const store={get(){try{return localStorage.getItem("aimap-lang")}catch(e){return null}},set(v){try{localStorage.setItem("aimap-lang",v)}catch(e){}}};
function detect(){const s=store.get();if(s&&CODES.includes(s))return s;const nav=(navigator.languages||[navigator.language||"ja"]).map(x=>String(x).slice(0,2).toLowerCase());return nav.find(c=>CODES.includes(c))||"ja"}
async function load(c){if(!DATA[c])throw new Error(c);return DATA[c]}
const li=a=>a.map(x=>`<li>${rb(x)}</li>`).join("");
function renderStatic(){
 const u=D.ui;
 for(const k of ["title","lang","lead","trackMain","trackSub","hint","planTitle","thDate","thCls","thStage","thAim","planNote","footer"]){const el=document.getElementById("t-"+k);if(el)el.innerHTML=rb(u[k])}
 document.title=plain(u.title);
 document.documentElement.lang=(LANGS.find(l=>l[0]===lang)||LANGS[0])[2];
 let si=0;ALL=[...D.steps.map((x,i)=>{const a=si,b=si+SESS[i]-1;si+=SESS[i];return {...x,id:IDS[i],n:String(i+1),s:SESS[i],rl:RES[i],first:a,last:b,term:a===b?fmtD(DATES[a]):fmtD(DATES[a])+" – "+fmtD(DATES[b]),step:true}}),...D.themes.map((x,i)=>({...x,id:IDS[NST+i],step:false}))];
 const st=x=>`<li><button class="st" data-id="${x.id}" aria-current="false"><span class="dot">${rb(x.n)}</span><span><span class="nm">${rb(x.nm)}</span><span class="ds">${rb(x.ds)}</span></span></button></li>`;
 document.getElementById("main").innerHTML=ALL.filter(x=>x.step).map(st).join("");
 document.getElementById("sub").innerHTML=ALL.filter(x=>!x.step).map(st).join("");
 document.querySelectorAll(".st").forEach(b=>b.addEventListener("click",()=>{go(ALL.findIndex(x=>x.id===b.dataset.id));panel.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}));
 const steps=ALL.filter(x=>x.step);
 document.getElementById("plan").innerHTML=DATES.map((dt,j)=>{const x=steps.find(y=>j>=y.first&&j<=y.last);return `<tr><td style="white-space:nowrap">${esc(fmtD(dt,true))}</td><td style="white-space:nowrap">${rb(fill(u.cls,{k:START+j}))}</td><td><a href="#${x.id}" style="color:inherit">${x.n}. ${rb(x.nm)}</a></td><td>${rb(D.sessions[j])}</td></tr>`}).join("");
 const hd=[...document.querySelectorAll(".stack thead th")].map(t=>t.textContent);document.querySelectorAll(".stack tbody tr").forEach(r=>[...r.cells].forEach((c,j)=>c.dataset.l=hd[j]||""));
}
function show(id,focus){
 const u=D.ui;const i=Math.max(0,ALL.findIndex(x=>x.id===id));const x=ALL[i];
 document.querySelectorAll(".st").forEach(b=>b.setAttribute("aria-current",b.dataset.id===x.id));
 const tag=x.step?fill(u.stepTag,{n:x.n,s:x.s,term:x.term}):u.themeTag;
 const pv=i>0?ALL[i-1].nm:u.prev,nx=i<ALL.length-1?ALL[i+1].nm:u.next;
 panel.innerHTML=`<div class="phead"><h2>${x.step?x.n+". ":""}${rb(x.nm)}</h2><span class="tag">${rb(tag)}</span></div>
 <p class="goal"><b>${rb(u.goal)}:</b> ${rb(x.goal)}</p>
 <div class="cols"><div><h3>${rb(u.topics)}</h3><ul class="pts">${li(x.topics)}</ul></div>
 <div><h3>${rb(u.ex)}</h3><ul class="pts">${li(x.ex)}</ul><h3>${rb(u.check)}</h3><ul class="pts">${li(x.check)}</ul></div></div>
 <div class="box"><h3>${rb(u.tips)}</h3><ul class="pts">${li(x.tips)}</ul>${x.cross?`<h3>${rb(u.cross)}</h3><p style="margin:0">${rb(x.cross)}</p>`:""}</div>
 ${x.rl?`<div class="more"><h3>${rb(u.more)}</h3><ul class="res">${x.rl.map((l,j)=>`<li><a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a><span>${rb(x.res[j]||"")}</span></li>`).join("")}</ul><p class="note" style="margin:8px 0 0">${rb(u.enNote)}</p></div>`:""}
 <div class="nav"><button class="btn" id="prev" ${i===0?"disabled":""}>← ${rb(pv)}</button><button class="btn" id="next" ${i===ALL.length-1?"disabled":""}>${rb(nx)} →</button></div>`;
 document.getElementById("prev").onclick=()=>go(i-1,true);
 document.getElementById("next").onclick=()=>go(i+1,true);
 cur=i;
 if(focus)document.querySelector(`.st[data-id="${x.id}"]`).focus({preventScroll:true});
}
function go(i,f){if(i<0||i>=ALL.length)return;const id=ALL[i].id;try{history.replaceState(null,"","#"+id)}catch(e){location.hash=id}show(id,f)}
const fromHash=()=>{if(D)show((location.hash||"#step-1").slice(1))};
async function setLang(c){
 try{D=await load(c);lang=c}catch(e){if(c!=="ja"){return setLang("ja")}panel.textContent="Could not load the language file.";return}
 sel.value=lang;store.set(lang);renderStatic();show(ALL[cur]?ALL[cur].id:(location.hash||"#step-1").slice(1));
}
sel.addEventListener("change",()=>setLang(sel.value));
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select"))return;if(e.key==="ArrowRight"){go(cur+1,true)}else if(e.key==="ArrowLeft"){go(cur-1,true)}});
window.addEventListener("hashchange",fromHash);
cur=Math.max(0,IDS.indexOf((location.hash||"#step-1").slice(1)));
setLang(detect());
}
</script>
</body>
</html>
